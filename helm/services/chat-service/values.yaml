# Параметры приложения (Deployment/Service)
image:
  repository: vibe/chat-service
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 50051

redis:
  password: redis
  secretName: redis-secret

config:
  secretName: service-secret
  namespace: chat
  env:
    GRPC_PORT: 50051
    AUTH_SERVICE_HOST: auth-service.auth.svc.cluster.local
    AUTH_SERVICE_PORT: "50032"
    DATABASE_HOST: chat-pg-rw
    DATABASE_PORT: "5432"
    DATABASE_SSLMODE: disable
    DATABASE_USER: chat_user
    DATABASE_DBNAME: chat-db
    REDIS_HOST: chat-redis-leader
    REDIS_PORT: "6379"


db:
  username: chat_user
  password: postgres 
  secretName: chat-db-secret
  database: auth-db

migrations:
  enabled: true
  command: /app/migrate -path=/app/migrations \
    -database "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_DBNAME)?sslmode=$(DATABASE_SSLMODE)" up


# Конфиг сабчарта postgres-cluster
postgres-cluster:
  clusterName: chat-pg
  namespace: chat
  instances: 1
  storage:
    size: 2Gi
  roles:
    - name: chat_user
      passwordSecret: chat-db-secret
  database:
    enabled: true
    name: chat-db
    owner: chat_user
  expose:
    rw:
      enabled: false 

redis-cluster:
  clusterName: chat-redis
  namespace: chat
  instances: 1                # для dev можно 1, для prod — 3+
  storage:
    size: 512Mi
    storageClass: ""          # если пусто — возьмется по умолчанию
  auth:
    enabled: true
    passwordSecret: chat-redis-secret
    password: myRedisPass123  # в проде лучше задавать через секрет
  expose:
    leader:
      enabled: true
      type: LoadBalancer
      port: 6379
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
    follower:
      enabled: false
      type: NodePort
      port: 30079
      annotations: {}

  metrics:
    enabled: false

