apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istio-controlplane
  namespace: istio-system
spec:
  profile: demo
  meshConfig:
    extensionProviders:
      - name: "ext-authz-grpc"
        envoyExtAuthzGrpc:
          service: "auth-service.auth.svc.cluster.local"
          port: 50032