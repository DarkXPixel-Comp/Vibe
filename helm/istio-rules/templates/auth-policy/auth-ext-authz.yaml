apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: auth-ext-authz-validate
  namespace: authpolicy
spec:
  selector:
    matchLabels:
      app: auth-service
  action: CUSTOM
  provider:
    name: "ext-authz-grpc"
  rules:
  - to:
    - operation:
        paths: ["/auth.AuthService/ValidateToken"]